name: 'MoonBit Security Audit'
description: 'AST-level static security scanner for MoonBit projects — detects XSS, CORS misconfiguration, path traversal, CRLF injection, and more'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Path to the MoonBit project to scan (relative to workspace root)'
    required: false
    default: '.'
  format:
    description: 'Output format: text, json, sarif'
    required: false
    default: 'sarif'
  severity:
    description: 'Minimum severity to report: error, warning, info'
    required: false
    default: 'warning'
  fail-on-findings:
    description: 'Fail the workflow step if any findings are detected'
    required: false
    default: 'false'
  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning (requires security-events: write permission)'
    required: false
    default: 'true'

outputs:
  findings-count:
    description: 'Number of security findings detected'
    value: ${{ steps.scan.outputs.findings-count }}
  report-file:
    description: 'Path to the generated report file'
    value: ${{ steps.scan.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: Install MoonBit toolchain
      shell: bash
      run: |
        if command -v moon &> /dev/null; then
          echo "MoonBit toolchain already installed"
        else
          bash "$GITHUB_ACTION_PATH/scripts/install-moon.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon update
        fi

    - name: Setup moon-audit
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        moon install

    - name: Run security scan
      id: scan
      shell: bash
      env:
        AUDIT_PATH: ${{ inputs.path }}
        AUDIT_FORMAT: ${{ inputs.format }}
        AUDIT_SEVERITY: ${{ inputs.severity }}
        AUDIT_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        AUDIT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-scan.sh"

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
