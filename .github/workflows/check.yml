name: Check and Test
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install (unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          bash scripts/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: install (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Keep native commands in separate steps so PowerShell cannot replace
      # an earlier nonzero exit status with a later command's success.
      - name: MoonBit toolchain version
        run: moon version --all

      - name: Update MoonBit package index
        run: moon update

      - name: Harness regression tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python3 tests/harness/test_harnesses.py

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon fmt
        run: moon fmt --check

      - name: moon info
        run: moon info

      - name: Check generated interfaces
        run: git diff --exit-code

      - name: moon test
        run: moon test --target all --deny-warn

      - name: Counterexample regression gate
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: bash tests/cases/run.sh

      - name: CLI integration regression tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python3 scripts/cli_regression_test.py
